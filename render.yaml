# One-click deploy on Render: New + → Blueprint → pick this repo.
services:
  - type: web
    name: haru
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: haru-data
      mountPath: /data
      sizeGB: 1
